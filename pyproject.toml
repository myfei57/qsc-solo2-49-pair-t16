[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linecontrol"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
linecontrol = "linecontrol.__main__:main"

[tool.setuptools.packages.find]
include = ["linecontrol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
