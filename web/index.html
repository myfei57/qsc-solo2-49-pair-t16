<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酸洗线控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>连续酸洗线控制台</h1>
  <span id="phase" class="badge">idle</span>
</header>
<nav class="tabs">
  <button class="tab" data-tab="overview">总览</button>
  <button class="tab" data-tab="ops">操作</button>
  <button class="tab" data-tab="audit">记录查询</button>
</nav>
<main>
  <section id="tab-overview" class="tabpage">
    <div class="panel">
      <h2>产线状态</h2>
      <dl class="grid">
        <dt>卷号</dt><dd id="coil">-</dd>
        <dt>带头位置</dt><dd id="head">0</dd>
        <dt>对中</dt><dd id="aligned">未确认</dd>
        <dt>焊缝跟踪点</dt><dd id="track">0</dd>
        <dt>张力设定</dt><dd id="tension">0</dd>
        <dt>实际张力</dt><dd id="effective">0</dd>
        <dt>槽体液位</dt><dd id="level">0</dd>
        <dt>酸浓度</dt><dd id="concentration">0</dd>
        <dt>喷淋</dt><dd id="rinsing">关</dd>
        <dt>酸泵</dt><dd id="pump">停</dd>
        <dt>烘干炉</dt><dd id="dry">停</dd>
        <dt>带尾残酸</dt><dd id="tail">脏</dd>
        <dt>带钢速度</dt><dd id="speed">0</dd>
        <dt>累计行程</dt><dd id="travel">0</dd>
      </dl>
    </div>
    <div class="panel">
      <h2>状态灯</h2>
      <ul id="lamps" class="lamps"></ul>
    </div>
    <div class="panel">
      <h2>告警</h2>
      <ul id="alarmList" class="alarms"></ul>
    </div>
  </section>

  <section id="tab-ops" class="tabpage hidden">
    <div class="panel">
      <h2>焊接与张力</h2>
      <div class="ops">
        <button data-op="weld-confirm">焊接并提速</button>
        <button data-op="weld-alarm">过流告警</button>
        <button data-op="weld-clear">告警复位</button>
        <button data-op="weld-release">联锁释放</button>
      </div>
      <form class="inline" data-form="weld-power">
        <label>电压<input name="voltage" type="number" step="1" value="24"></label>
        <label>电流<input name="current" type="number" step="1" value="320"></label>
        <button type="submit">下发焊接功率</button>
      </form>
      <form class="inline" data-form="weld-splice">
        <label>接头位点<input name="pos" type="number" step="0.5" value="120"></label>
        <button type="submit">新接头并刷新跟踪</button>
      </form>
      <form class="inline" data-form="tension-ramp">
        <label>目标速度<input name="target" type="number" step="0.1" value="2.5"></label>
        <button type="submit">执行提速</button>
      </form>
      <form class="inline" data-form="tension-calibrate">
        <label>张力增益<input name="gain" type="number" step="0.01" value="1.08"></label>
        <button type="submit">标定增益</button>
      </form>
    </div>
    <div class="panel">
      <h2>酸洗与烘干</h2>
      <form class="inline" data-form="pump-start">
        <label>槽体液位<input name="level" type="number" step="0.1" value="4.2"></label>
        <button type="submit">启动酸循环</button>
      </form>
      <form class="inline" data-form="pump-replenish">
        <label>槽体容积<input name="volume" type="number" step="1" value="30"></label>
        <label>目标浓度<input name="target" type="number" step="0.1" value="18"></label>
        <button type="submit">补酸计算</button>
      </form>
      <form class="inline" data-form="pickle-calibrate">
        <label>浓度偏移<input name="offset" type="number" step="0.1" value="0.6"></label>
        <button type="submit">标定酸浓度</button>
      </form>
      <form class="inline" data-form="dry-dew">
        <label>露点<input name="value" type="number" step="1" value="12"></label>
        <button type="submit">设置露点</button>
      </form>
      <form class="inline" data-form="dry-heat-target">
        <label>目标炉温<input name="temp" type="number" step="1" value="150"></label>
        <button type="submit">升温一步</button>
      </form>
      <div class="ops">
        <button data-op="dry-heat">排风升温并换卷</button>
        <button data-op="dry-reheat">故障后复热</button>
      </div>
    </div>
    <div class="panel">
      <h2>出入口与停机</h2>
      <form class="inline" data-form="strip-advance">
        <label>带钢位移<input name="delta" type="number" step="0.5" value="40"></label>
        <button type="submit">推进带钢</button>
      </form>
      <form class="inline" data-form="strip-speed">
        <label>设定速度<input name="speed" type="number" step="0.1" value="1.6"></label>
        <button type="submit">下发速度</button>
      </form>
      <form class="inline" data-form="entry-offset">
        <label>对中偏移<input name="value" type="number" step="0.5" value="3"></label>
        <button type="submit">调整对中</button>
      </form>
      <form class="inline" data-form="entry-sample">
        <label>位置采样<input name="value" type="number" step="0.1" value="12.5"></label>
        <button type="submit">采样</button>
      </form>
      <form class="inline" data-form="shear-offset">
        <label>剪切偏移<input name="offset" type="number" step="0.5" value="2"></label>
        <button type="submit">设置剪切偏移</button>
      </form>
      <form class="inline" data-form="exit-weight">
        <label>入口厚<input name="entry" type="number" step="0.01" value="2.5"></label>
        <label>出口厚<input name="exit" type="number" step="0.01" value="2.2"></label>
        <label>板宽<input name="width" type="number" step="1" value="1250"></label>
        <label>长度<input name="length" type="number" step="1" value="4200"></label>
        <button type="submit">估算卷重</button>
      </form>
      <div class="ops">
        <button data-op="entry-correct">对中纠偏</button>
        <button data-op="strip-sag">读取垂度</button>
        <button data-op="stop">停机</button>
      </div>
      <form class="inline" data-form="cycle">
        <label>卷号<input name="coil" type="text" value="C-2026-01"></label>
        <label>对中目标<input name="target" type="number" step="0.5" value="95"></label>
        <label>液位<input name="level" type="number" step="0.1" value="4.4"></label>
        <label>电压<input name="voltage" type="number" step="1" value="24"></label>
        <label>电流<input name="current" type="number" step="1" value="300"></label>
        <label>速度<input name="speed" type="number" step="0.1" value="1.5"></label>
        <button type="submit">整卷联动</button>
      </form>
    </div>
  </section>

  <section id="tab-audit" class="tabpage hidden">
    <div class="panel">
      <h2>事件统计</h2>
      <ul id="summary" class="summary"></ul>
    </div>
    <div class="panel">
      <h2>查询</h2>
      <form class="inline" data-form="audit-query">
        <label>事件类型
          <select name="kind">
            <option value="">全部</option>
            <option value="coil">coil</option>
            <option value="align">align</option>
            <option value="arc">arc</option>
            <option value="weld">weld</option>
            <option value="tension">tension</option>
            <option value="pump">pump</option>
            <option value="level">level</option>
            <option value="rinse">rinse</option>
            <option value="dry">dry</option>
            <option value="exhaust">exhaust</option>
            <option value="shear">shear</option>
            <option value="track">track</option>
            <option value="latch">latch</option>
            <option value="alarm">alarm</option>
            <option value="recover">recover</option>
            <option value="stop">stop</option>
            <option value="audit">audit</option>
          </select>
        </label>
        <label>条数<input name="limit" type="number" step="1" value="30"></label>
        <button type="submit">查询</button>
      </form>
    </div>
    <div class="panel">
      <h2>最近事件</h2>
      <ol id="auditList" class="audit"></ol>
    </div>
    <div class="panel">
      <h2>流程步骤</h2>
      <ol id="sequenceList" class="audit"></ol>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
